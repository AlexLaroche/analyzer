name: h2scan

# Whole-module Goblint race analysis of Apache httpd mod_http2 (2.4.70 vs 2.4.71)
# with this fork's apr library group. Positive control: 2.4.70 must report a race
# at h2_request.i:8158 (CVE-2026-119618, apr_table_setn on req->headers).

on:
  push:
    branches: [h2scan-ci]
  workflow_dispatch:

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        version: ['70', '71']
        target: ['whole', '1', '2', '3', '4', '5']
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        env:
          OPAMLOCKED: locked
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda

      - name: Install dependencies
        run: opam install . --deps-only --locked

      - name: Build
        run: ./make.sh nat

      - name: Unpack inputs
        run: tar xJf h2scan/h2scan-inputs.tar.xz -C h2scan

      - name: Analyse httpd-2.4.${{ matrix.version }} mod_http2 (${{ matrix.target }})
        run: |
          set +e
          v=${{ matrix.version }}; t=${{ matrix.target }}
          if [ "$t" = whole ]; then
            FILES="h2scan/i$v/*.i"
          else
            # hand-off scenario t: one-pass workers, loop-free beam model, scenario harness
            FILES="$(ls h2scan/i$v/*.i | grep -v -e harness.i -e h2_bucket_beam.i -e h2_workers.i) h2scan/handoff/h$v/h2_workers_once.i h2scan/handoff/h$v/beam_model.i h2scan/handoff/h$v/handoff$t.i"
          fi
          free -h; nproc
          # Cap Goblint at 13 GiB so it fails on its own instead of starving the runner
          # (run 43280606465 lost both runners this way, with no output).
          ulimit -v $((13 * 1024 * 1024))
          /usr/bin/time -v timeout 20400 ./goblint \
            --set lib.activated[+] apr --set ana.activated[+] threadJoins \
            --set ana.malloc.unique_address_count 1 \
            --disable sem.unknown_function.spawn --disable sem.unknown_function.call \
            --disable sem.unknown_function.invalidate.globals --disable sem.unknown_function.invalidate.args \
            --disable sem.unknown_function.read.args \
            --set ana.activated[-] expRelation \
            --disable ana.base.context.non-ptr --disable ana.base.context.int \
            --set ana.ctx_insens[+] base --set ana.ctx_insens[+] mallocWrapper \
            --disable ana.thread.context.create-edges \
            --set dbg.timing.enabled true --set dbg.solver-stats-interval 600 \
            $FILES > out.txt 2> time.txt
          echo "goblint exit=$?"
          tail -40 time.txt
          echo "--- race summary ---"
          grep -E 'race|Race' out.txt | head -100
          echo "--- reachability of worker request path ---"
          grep -E "Function '(assign_headers|h2_create_request_rec|h2_c2_process|c2_prod_next|s_next_c2)' is uncalled" out.txt || echo "all reached"
          echo "--- CVE-2026-119618 line (h2_request.i:8158) ---"
          grep -n 'h2_request.i:815' out.txt || echo "not reported"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2scan-${{ matrix.version }}-${{ matrix.target }}
          path: |
            out.txt
            time.txt
